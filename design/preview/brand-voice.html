<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .voice { background:#fff; border:1px solid var(--beni-line); border-radius:16px; padding:14px 16px; }
  .voice + .voice { margin-top:10px }
  .yes { border-left:4px solid #2f7d4f } .no { border-left:4px solid #b3322a }
  .label { font:600 11px var(--font-mono); letter-spacing:.1em; color:var(--fg-3); text-transform:uppercase }
  .quote { font:500 15px var(--font-sans); color:var(--fg-1); margin-top:4px; font-style:italic }
</style></head>
<body><div class="card cream">
  <div class="voice yes"><div class="label">Yes ·  Beni voice</div><div class="quote">"You've got $1,842 left in your FSA. Want help spending it before December?"</div></div>
  <div class="voice no"><div class="label">No · jargon</div><div class="quote">"FY24 contributory balance: $1,842.50. Forfeiture deadline 12/31."</div></div>
  <div class="voice yes"><div class="label">Yes · warm</div><div class="quote">"Welcome back, Maya. Three things are ready for you today."</div></div>
  <div class="voice no"><div class="label">No · cold</div><div class="quote">"Dashboard. 3 pending tasks."</div></div>
</div></body></html>

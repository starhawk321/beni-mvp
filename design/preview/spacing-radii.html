<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="grid-3" style="grid-template-columns:repeat(6,1fr);gap:14px">
    <div class="col" style="gap:6px;align-items:center"><div style="width:60px;height:60px;background:#FFC799;border-radius:4px"></div><div class="label">r-1 · 4</div></div>
    <div class="col" style="gap:6px;align-items:center"><div style="width:60px;height:60px;background:#FFC799;border-radius:8px"></div><div class="label">r-2 · 8</div></div>
    <div class="col" style="gap:6px;align-items:center"><div style="width:60px;height:60px;background:#FFC799;border-radius:12px"></div><div class="label">r-3 · 12</div></div>
    <div class="col" style="gap:6px;align-items:center"><div style="width:60px;height:60px;background:#FFC799;border-radius:16px"></div><div class="label">r-4 · 16</div></div>
    <div class="col" style="gap:6px;align-items:center"><div style="width:60px;height:60px;background:#FFC799;border-radius:28px"></div><div class="label">r-6 · 28</div></div>
    <div class="col" style="gap:6px;align-items:center"><div style="width:80px;height:32px;background:#FFC799;border-radius:999px"></div><div class="label">pill</div></div>
  </div>
  <div class="label" style="margin-top:14px">Default cards use r-4. Hero cards use r-6. Pills for chips & primary buttons.</div>
</div></body></html>

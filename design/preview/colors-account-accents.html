<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card cream">
  <div class="grid-3" style="grid-template-columns:repeat(6,1fr);gap:10px">
    <div class="col" style="gap:6px"><div class="swatch" style="background:#B8D0E8;aspect-ratio:1/1"></div><div class="label">Medical</div><div class="label" style="color:var(--fg-4)">#B8D0E8</div></div>
    <div class="col" style="gap:6px"><div class="swatch" style="background:#C7E5F2;aspect-ratio:1/1"></div><div class="label">Dental</div><div class="label" style="color:var(--fg-4)">#C7E5F2</div></div>
    <div class="col" style="gap:6px"><div class="swatch" style="background:#D8CDF2;aspect-ratio:1/1"></div><div class="label">Vision</div><div class="label" style="color:var(--fg-4)">#D8CDF2</div></div>
    <div class="col" style="gap:6px"><div class="swatch" style="background:#FFC4BE;aspect-ratio:1/1"></div><div class="label">FSA</div><div class="label" style="color:var(--fg-4)">#FFC4BE</div></div>
    <div class="col" style="gap:6px"><div class="swatch" style="background:#FFD9B8;aspect-ratio:1/1"></div><div class="label">HSA</div><div class="label" style="color:var(--fg-4)">#FFD9B8</div></div>
    <div class="col" style="gap:6px"><div class="swatch" style="background:#FFF2B0;aspect-ratio:1/1"></div><div class="label">Life</div><div class="label" style="color:var(--fg-4)">#FFF2B0</div></div>
  </div>
  <div class="label" style="margin-top:14px">Pastel accent set. Each plan/account type carries one tint; pair with ink text and a darker border on chips for contrast.</div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="grid-4">
    <div>
      <div class="swatch" style="background:#e3f1e7;color:#2f7d4f">Positive<br><span class="label">+$420 saved</span></div>
      <div class="label" style="margin-top:6px">--status-positive</div>
    </div>
    <div>
      <div class="swatch" style="background:#fdecd1;color:#b56a16">Warning<br><span class="label">Claim pending</span></div>
      <div class="label" style="margin-top:6px">--status-warning</div>
    </div>
    <div>
      <div class="swatch" style="background:#fde0dd;color:#b3322a">Critical<br><span class="label">Action needed</span></div>
      <div class="label" style="margin-top:6px">--status-critical</div>
    </div>
    <div>
      <div class="swatch" style="background:#dff0f8;color:#0586C3">Info<br><span class="label">New benefit</span></div>
      <div class="label" style="margin-top:6px">--status-info</div>
    </div>
  </div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .field { display:flex;flex-direction:column;gap:6px;margin-bottom:14px }
  .field label { font-size:12px;font-weight:600;color:var(--fg-2);letter-spacing:.02em }
  .input { height:48px; padding:0 14px; border-radius:12px; border:1px solid var(--beni-line-strong); background:#fff; font:500 15px var(--font-sans); color:var(--fg-1); }
  .input:focus { outline: none; border-color: var(--beni-sky); box-shadow: var(--shadow-focus); }
  .input.error { border-color: #b3322a; }
  .help { font-size:12px;color:var(--fg-3) }
  .help.err { color: #b3322a }
</style>
</head>
<body><div class="card">
  <div class="grid-2">
    <div class="field">
      <label>Member ID</label>
      <input class="input" value="MA-204918"/>
      <div class="help">From your insurance card.</div>
    </div>
    <div class="field">
      <label>Date of birth</label>
      <input class="input" placeholder="MM / DD / YYYY"/>
    </div>
    <div class="field">
      <label>ZIP</label>
      <input class="input error" value="0000"/>
      <div class="help err">That ZIP doesn't look right.</div>
    </div>
    <div class="field">
      <label>Email</label>
      <input class="input" value="maya@example.com" disabled style="background:#f3ede1;color:var(--fg-3)"/>
      <div class="help">Locked — managed by your employer.</div>
    </div>
  </div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="grid-5">
    <div class="swatch" style="background:#FBF6EE;color:#0D1B2A">Cream<br><span class="label">--bg-canvas</span></div>
    <div class="swatch" style="background:#FFFFFF;color:#0D1B2A">Paper<br><span class="label">--bg-surface</span></div>
    <div class="swatch" style="background:#F3EDE1;color:#0D1B2A">Sunken<br><span class="label">--bg-sunken</span></div>
    <div class="swatch" style="background:#E8E3D8;color:#0D1B2A">Line<br><span class="label">--beni-line</span></div>
    <div class="swatch" style="background:#D6CFC1;color:#0D1B2A">Line+<br><span class="label">line-strong</span></div>
  </div>
  <div class="grid-4" style="margin-top:14px">
    <div class="swatch" style="background:#0D1B2A;color:#fff">Ink<br><span style="opacity:.7">--fg-1</span></div>
    <div class="swatch" style="background:#2A3A4D;color:#fff">Ink-2<br><span style="opacity:.7">--fg-2</span></div>
    <div class="swatch" style="background:#5B6B7D;color:#fff">Ink-3<br><span style="opacity:.7">--fg-3</span></div>
    <div class="swatch" style="background:#8A96A4;color:#fff">Ink-4<br><span style="opacity:.7">--fg-4</span></div>
  </div>
</div></body></html>

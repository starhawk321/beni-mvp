<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .hero { background: #004383; color:#FFE9CF; border-radius:28px; padding:24px; position:relative; overflow:hidden; }
  .hero::after { content:""; position:absolute; right:-60px; top:-40px; width:240px; height:240px; border-radius:999px; background:radial-gradient(circle, #FFA199 0%, #FFA199 40%, transparent 70%); opacity:.55 }
  .hero .label { font:600 11px var(--font-sans); letter-spacing:.14em; text-transform:uppercase; color:#FFC799 }
  .hero .amt { font:700 48px var(--font-sans); font-variant-numeric:tabular-nums; letter-spacing:-.02em; margin-top:6px; color:#fff }
  .hero .meta { font:500 13px var(--font-sans); color:#cfd9e6; margin-top:4px; max-width:60% }
  .hero .pill { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; background:rgba(255,231,194,.18); color:#FFC799; border-radius:999px; font:600 12px var(--font-sans); margin-top:14px; backdrop-filter:blur(4px) }
</style></head>
<body><div class="card cream">
  <div class="hero">
    <div class="label">Total benefits balance</div>
    <div class="amt">$8,956.70</div>
    <div class="meta">Across 6 accounts. You've used 38% of this year's pre-tax dollars.</div>
    <div class="pill">↗ +$340 this month</div>
  </div>
</div></body></html>

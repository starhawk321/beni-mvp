<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="grid-3" style="grid-template-columns:repeat(8,1fr);gap:8px;align-items:flex-end">
    <div class="col" style="gap:6px"><div style="height:4px;background:#0586C3;border-radius:2px"></div><div class="label">1·4</div></div>
    <div class="col" style="gap:6px"><div style="height:8px;background:#0586C3;border-radius:2px"></div><div class="label">2·8</div></div>
    <div class="col" style="gap:6px"><div style="height:12px;background:#0586C3;border-radius:2px"></div><div class="label">3·12</div></div>
    <div class="col" style="gap:6px"><div style="height:16px;background:#0586C3;border-radius:2px"></div><div class="label">4·16</div></div>
    <div class="col" style="gap:6px"><div style="height:24px;background:#0586C3;border-radius:2px"></div><div class="label">6·24</div></div>
    <div class="col" style="gap:6px"><div style="height:32px;background:#0586C3;border-radius:2px"></div><div class="label">7·32</div></div>
    <div class="col" style="gap:6px"><div style="height:56px;background:#0586C3;border-radius:2px"></div><div class="label">9·56</div></div>
    <div class="col" style="gap:6px"><div style="height:96px;background:#0586C3;border-radius:2px"></div><div class="label">11·96</div></div>
  </div>
  <div class="label" style="margin-top:14px">4-pt scale · use --space-1 through --space-11.</div>
</div></body></html>

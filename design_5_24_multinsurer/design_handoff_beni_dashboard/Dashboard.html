<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Beni — Dashboard</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #0a1320; }
  body {
    font-family: var(--font-sans);
    color: #F4ECDE;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  *, *::before, *::after { box-sizing: border-box; }
  /* design canvas dark theme override */
  .dc-root { background: #0a1320; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>

<script type="text/babel" data-presets="env,react">
  const App = () => (
    <DesignCanvas title="Beni — Dashboard" subtitle="Desktop + mobile · single-column · navy + pastels">
      <DCSection id="dashboard" title="Beni dashboard" subtitle="Sarthak's plan year">
        <DCArtboard id="desktop" label="Desktop · 1280" width={1280} height={2100}>
          <BeniDashboard variant="desktop" />
        </DCArtboard>
        <DCArtboard id="mobile" label="Mobile · 412" width={412} height={2580}>
          <BeniDashboard variant="mobile" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

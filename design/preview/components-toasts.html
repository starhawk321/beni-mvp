<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .toast { display:flex;gap:12px;align-items:flex-start; padding:14px 16px; border-radius:14px; background:#fff; border:1px solid var(--beni-line); box-shadow:var(--shadow-2); max-width:520px }
  .toast.pos { border-left:4px solid #2f7d4f }
  .toast.warn { border-left:4px solid #b56a16 }
  .toast.info { border-left:4px solid #0586C3 }
  .toast .title { font:700 14px var(--font-sans); color:var(--fg-1) }
  .toast .body  { font:500 13px var(--font-sans); color:var(--fg-2); margin-top:2px }
  .ico { width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0 }
</style></head>
<body><div class="card cream" style="display:flex;flex-direction:column;gap:10px">
  <div class="toast pos"><div class="ico" style="background:#e3f1e7;color:#2f7d4f">✓</div>
    <div><div class="title">Claim approved</div><div class="body">$120 reimbursed to your FSA — should arrive in 2–3 days.</div></div></div>
  <div class="toast warn"><div class="ico" style="background:#fdecd1;color:#b56a16">⏱</div>
    <div><div class="title">Receipt needed</div><div class="body">We need a receipt for your March 11 dental visit to finish your claim.</div></div></div>
  <div class="toast info"><div class="ico" style="background:#dff0f8;color:#0586C3">i</div>
    <div><div class="title">New benefit available</div><div class="body">Your employer added One Medical — link it from Accounts.</div></div></div>
</div></body></html>

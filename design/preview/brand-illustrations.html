<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .illus { background:#fff; border:1px solid var(--beni-line); border-radius:18px; padding:18px;
           display:flex; align-items:center; gap:18px; }
  .illus img { width:128px; height:auto; flex-shrink:0; }
  .illus .meta { display:flex; flex-direction:column; gap:4px; }
  .illus .name { font:700 14px var(--font-sans); color:var(--fg-1); }
  .illus .use  { font:500 12px var(--font-sans); color:var(--fg-3); line-height:1.45; }
  .illus .file { font:500 10px var(--font-mono); color:var(--fg-4); margin-top:6px; }
</style>
</head>
<body><div class="card cream">
  <div class="grid-2">
    <div class="illus">
      <img src="../assets/illus-piggy.svg" alt="Saved illustration"/>
      <div class="meta">
        <div class="name">Saved</div>
        <div class="use">Empty states for FSA/HSA, claim approved, "you saved $X" moments.</div>
        <div class="file">illus-piggy.svg</div>
      </div>
    </div>
    <div class="illus">
      <img src="../assets/illus-care.svg" alt="Covered illustration"/>
      <div class="meta">
        <div class="name">Covered</div>
        <div class="use">Onboarding success, plan-linked confirmation, "you're protected" moments.</div>
        <div class="file">illus-care.svg</div>
      </div>
    </div>
  </div>
  <div class="label" style="margin-top:14px">Bold, flat, two-color spot illustrations. Used in empty states, claim confirmations, and onboarding success.</div>
</div></body></html>
